
[build]
  command = "npm install --prefix server && npm install --prefix client && npm run build --prefix client"
  publish = "client/dist"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "GEMINI_MODEL"
  SECRETS_SCAN_OMIT_PATHS = "server/.env.example,server/scripts/checkGeminiConnectivity.js,server/src/services/geminiService.js,server/tests/symptoms.test.js"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/app/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
