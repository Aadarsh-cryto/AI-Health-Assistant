
[build]
  command = "npm install --prefix backend && npm install --prefix frontend && npm run build --prefix frontend"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "GEMINI_MODEL"
  SECRETS_SCAN_OMIT_PATHS = "backend/.env.example,backend/scripts/checkGeminiConnectivity.js,backend/src/services/geminiService.js,backend/tests/symptoms.test.js"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/app/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
